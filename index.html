<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级蹭饭地图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html, #container { width: 100%; height: 100%; }
    #editor-panel {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      z-index: 999;
      width: 320px;
      max-height: 80%;
      overflow-y: auto;
      font-size: 14px;
    }
    #editor-panel.show { display: block; }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px 2px;
    }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-warning { background: #fbbc04; }
    .btn-danger { background: #ea4335; color: white; }
    .btn-success { background: #34a853; color: white; }
    input[type="file"] { display: none; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 4px; text-align: left; }
    th { background: #f2f2f2; }
    .close-btn { float: right; cursor: pointer; font-size: 18px; }
    .hidden-action {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      opacity: 0.3;
      font-size: 12px;
      cursor: default;
      user-select: none;
    }
    .nav-btn {
      display: inline-block;
      padding: 4px 10px;
      margin: 5px 3px 0 0;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
      color: white;
    }
    .nav-amap { background: #0091ff; }
    .nav-baidu { background: #3385ff; }

    /* Simple password modal */
    #password-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    #password-modal {
      background: white;
      padding: 16px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    #password-modal input[type="password"] {
      width: calc(100% - 12px);
      padding: 6px;
      margin-top: 8px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    #password-modal .actions { text-align: right; }
  </style>
</head>
<body>
  <div id="container"></div>

  <div class="hidden-action" id="editTrigger" title="点击唤起密码框进入编辑">编辑入口</div>

  <div id="editor-panel" role="dialog" aria-label="编辑同学数据面板">
    <span class="close-btn" id="closeEditor" title="关闭编辑面板">&times;</span>
    <h3>✏️ 编辑同学数据</h3>
    <p class="hint">上传CSV文件批量导入，或手动修改后导出网页</p>
    <input type="file" id="csvFileInput" accept=".csv">
    <button class="btn btn-primary" id="uploadBtn">选择CSV文件</button>
    <button class="btn btn-success" id="applyBtn" style="display:none;">✅ 应用到地图</button>
    <button class="btn btn-warning" id="exportBtn">下载更新后的网页</button>
    <div id="previewTable" aria-live="polite"></div>
  </div>

  <!-- Password modal (hidden by default) -->
  <div id="password-modal-backdrop" aria-hidden="true">
    <div id="password-modal" role="dialog" aria-label="输入编辑密码">
      <div>
        <strong>请输入编辑密码</strong>
      </div>
      <input id="passwordInput" type="password" autocomplete="off" placeholder="密码">
      <div class="actions">
        <button class="btn btn-primary" id="passwordConfirm">确定</button>
        <button class="btn" id="passwordCancel">取消</button>
      </div>
    </div>
  </div>

  <script>
    // 高德密钥替换区（请自行申请替换下方两个值）
    // WARNING: Avoid committing API keys to public repos. Move keys to server-side config or inject at deploy time.
    window._AMapSecurityConfig = {
      securityJsCode: "b3662a30f3a5bf6baf306aaf79a04b75"
    };
    const AMAP_KEY = "ed8b9d3491ce1ef0582a9c4ff6afdd01";
    const EDIT_PASSWORD = "123456"; // 编辑解锁密码 (建议移到安全的后端或在部署前修改)

    const script = document.createElement('script');
    script.src = `https://webapi.amap.com/v2/maps?v=2.0&key=${AMAP_KEY}&plugin=AMap.Geocoder,AMap.Scale,AMap.ToolBar`;
    document.head.appendChild(script);

    // CLASSMATES_DATA_START
    let classmatesData = [
      { name: "张三", contact: "13800000001", college: "北京大学", address: "北京市海淀区颐和园路5号" },
      { name: "李四", contact: "13900000002", college: "复旦大学", address: "上海市杨浦区邯郸路220号" },
      { name: "王五", contact: "13600000003", college: "中山大学", address: "广东省广州市海珠区新港西路135号" },
      { name: "赵六", contact: "13700000004", college: "西安交通大学", address: "陕西省西安市碑林区咸宁西路28号" }
    ];
    // CLASSMATES_DATA_END

    let map = null, geocoder = null, markers = [];
    let editorPanel = document.getElementById('editor-panel');

    // 简单的 HTML 转义以防 XSS
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 弹窗导航内容 (使用转义后的字段并添加 rel="noopener")
    function generateInfoContent(markerData) {
      const { name, college, contact, address, lng, lat } = markerData;
      const safeName = escapeHTML(name);
      const safeCollege = escapeHTML(college);
      const safeAddress = escapeHTML(address);
      const safeContact = escapeHTML(contact);

      const amapUrl = `https://uri.amap.com/navigation?to=${lng},${lat},${encodeURIComponent(name)}&mode=car&coordinate=gaode`;
      const baiduUrl = `https://api.map.baidu.com/direction?destination=${lat},${lng}&coord_type=gcj02&mode=driving&output=html&src=classmap`;

      return `
        <div style="padding:8px; min-width:160px;">
          <strong>${safeName}</strong><br/>
         ${safeCollege}<br/>
         ${safeAddress}<br/>
         ${safeContact}<br/>
          <div style="margin-top:8px;">
            <a class="nav-btn nav-amap" href="${amapUrl}" target="_blank" rel="noopener">高德导航</a>
            <a class="nav-btn nav-baidu" href="${baiduUrl}" target="_blank" rel="noopener">百度导航</a>
          </div>
        </div>
      `;
    }

    // 初始化地图
    function initMap() {
      map = new AMap.Map('container', {
        zoom: 5,
        center: [104.0, 35.0],
        resizeEnable: true
      });
      map.addControl(new AMap.Scale());
      map.addControl(new AMap.ToolBar());

      AMap.plugin('AMap.Geocoder', () => {
        geocoder = new AMap.Geocoder({});
        addMarkersFromData(classmatesData);
      });
    }

    // 批量生成点位标记
    function addMarkersFromData(dataArray) {
      clearMarkers();
      if (!geocoder) return;
      let loadedCount = 0;
      dataArray.forEach((item) => {
        if (!item.address) {
          loadedCount++;
          return;
        }
        geocoder.getLocation(item.address, (status, result) => {
          loadedCount++;
          if (status === 'complete' && result.geocodes && result.geocodes.length > 0) {
            const lnglat = result.geocodes[0].location;
            const marker = new AMap.Marker({
              position: [lnglat.lng, lnglat.lat],
              title: item.name,
              map: map
            });
            const markerData = {
              name: item.name,
              college: item.college,
              contact: item.contact,
              address: item.address,
              lng: lnglat.lng,
              lat: lnglat.lat
            };
            const infoWindow = new AMap.InfoWindow({
              content: generateInfoContent(markerData),
              offset: new AMap.Pixel(0, -30)
            });
            marker.on('click', () => {
              infoWindow.open(map, marker.getPosition());
            });
            markers.push(marker);
            if (loadedCount === dataArray.length && markers.length > 0) {
              map.setFitView();
            }
          } else {
            console.warn('地址解析失败:', item.address);
          }
        });
      });
    }

    function clearMarkers() {
      markers.forEach(m => m.setMap(null));
      markers = [];
    }

    // Password modal handling (replacing prompt-based flow)
    let isEditMode = false, pendingData = null;
    const editTrigger = document.getElementById('editTrigger');
    const backdrop = document.getElementById('password-modal-backdrop');
    const pwdInput = document.getElementById('passwordInput');
    const pwdConfirm = document.getElementById('passwordConfirm');
    const pwdCancel = document.getElementById('passwordCancel');

    editTrigger.addEventListener('click', () => {
      if (isEditMode) return;
      backdrop.style.display = 'flex';
      backdrop.setAttribute('aria-hidden', 'false');
      pwdInput.value = '';
      setTimeout(() => pwdInput.focus(), 50);
    });

    pwdCancel.addEventListener('click', () => {
      backdrop.style.display = 'none';
      backdrop.setAttribute('aria-hidden', 'true');
    });

    pwdConfirm.addEventListener('click', () => {
      const val = pwdInput.value;
      backdrop.style.display = 'none';
      backdrop.setAttribute('aria-hidden', 'true');
      if (val === '') return;
      if (val === EDIT_PASSWORD) {
        isEditMode = true;
        editorPanel.classList.add('show');
      } else {
        alert('密码错误！');
      }
    });

    document.getElementById('closeEditor').addEventListener('click', () => {
      editorPanel.classList.remove('show');
      isEditMode = false;
      pendingData = null;
      document.getElementById('applyBtn').style.display = 'none';
      document.getElementById('previewTable').innerHTML = '';
    });

    // CSV文件读取
    document.getElementById('uploadBtn').addEventListener('click', () => {
      document.getElementById('csvFileInput').click();
    });
    document.getElementById('csvFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const csv = ev.target.result;
        const parsed = parseCSV(csv);
        if (parsed.length === 0) {
          alert('CSV解析失败或为空，请检查格式（姓名,联系方式,大学,大学地址）');
          return;
        }
        pendingData = parsed;
        showPreview(parsed);
        document.getElementById('applyBtn').style.display = 'inline-block';
      };
      reader.readAsText(file, 'UTF-8');
    });

    // 更鲁棒的 CSV 解析（支持双引号包含、转义双引号、CRLF）
    // 对于更完整的解析，建议使用 PapaParse（https://www.papaparse.com/）
    function parseCSV(str) {
      if (!str) return [];
      // 移除可能的 BOM
      if (str.charCodeAt(0) === 0xFEFF) str = str.slice(1);
      // 规范换行
      str = str.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      // 将整个文本解析成行（遵循 CSV 引号规则）
      const rows = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        const next = str[i+1];
        if (ch === '"') {
          if (inQuotes && next === '"') {
            // 双引号转义 -> 添加一个引号并跳过下一个
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }
        if (ch === '\n' && !inQuotes) {
          rows.push(cur);
          cur = '';
          continue;
        }
        cur += ch;
      }
      if (cur !== '') rows.push(cur);

      if (rows.length === 0) return [];

      // 将单行拆分为单元格（统一处理引号与转义）
      function splitRow(line) {
        const cells = [];
        let cell = '';
        let q = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          const next = line[i+1];
          if (ch === '"') {
            if (q && next === '"') {
              cell += '"';
              i++;
            } else {
              q = !q;
            }
            continue;
          }
          if (ch === ',' && !q) {
            cells.push(cell);
            cell = '';
            continue;
          }
          cell += ch;
        }
        cells.push(cell);
        return cells;
      }

      const headerFields = splitRow(rows[0]).map(h => h.trim());
      const nameIdx = headerFields.findIndex(h => /姓名/.test(h));
      const contactIdx = headerFields.findIndex(h => /联系方式|电话/.test(h));
      const collegeIdx = headerFields.findIndex(h => /大学(?!.*地址)/.test(h));
      const addrIdx = headerFields.findIndex(h => /地址/.test(h));
      if (nameIdx === -1 || addrIdx === -1) {
        alert('CSV表头必须包含“姓名”和“大学地址”列');
        return [];
      }

      const result = [];
      for (let r = 1; r < rows.length; r++) {
        if (rows[r].trim() === '') continue;
        const cells = splitRow(rows[r]).map(c => c.trim());
        result.push({
          name: cells[nameIdx] || '',
          contact: contactIdx !== -1 ? (cells[contactIdx] || '') : '',
          college: collegeIdx !== -1 ? (cells[collegeIdx] || '') : '',
          address: cells[addrIdx] || ''
        });
      }
      return result;
    }

    // 表格预览（对内容做转义以防 XSS）
    function showPreview(data) {
      let html = '<table><tr><th>姓名</th><th>大学</th><th>地址</th></tr>';
      data.forEach(item => {
        html += `<tr><td>${escapeHTML(item.name)}</td><td>${escapeHTML(item.college)}</td><td>${escapeHTML(item.address)}</td></tr>`;
      });
      html += '</table>';
      document.getElementById('previewTable').innerHTML = html;
    }

    // 应用CSV数据到地图
    document.getElementById('applyBtn').addEventListener('click', () => {
      if (pendingData) {
        classmatesData = pendingData;
        addMarkersFromData(classmatesData);
        alert('地图已更新！下载新网页文件替换原有文件即可同步给所有人');
      }
    });

    // 导出新版HTML文件（使用明确的开始/结束标记以避免错误替换）
    document.getElementById('exportBtn').addEventListener('click', () => {
      const newDataStr = JSON.stringify(classmatesData, null, 2);
      let htmlContent = document.documentElement.outerHTML;

      const startMarker = '/* CLASSMATES_DATA_START */';
      const endMarker = '/* CLASSMATES_DATA_END */';

      // 使用正则安全替换 startMarker 和 endMarker 之间的内容
      const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const markerRegex = new RegExp(esc(startMarker) + '[\\s\\S]*?' + esc(endMarker), 'm');

      const replacement = startMarker + '\nlet classmatesData = ' + newDataStr + ';\n' + endMarker;

      if (markerRegex.test(htmlContent)) {
        htmlContent = htmlContent.replace(markerRegex, replacement);
      } else {
        // 兜底：如果没有找到标记，仍进行旧式替换以兼容老版本
        const legacyRegex = /let\s+classmatesData\s*=\s*\[[\s\S]*?\]\s*;/;
        if (legacyRegex.test(htmlContent)) {
          htmlContent = htmlContent.replace(legacyRegex, replacement);
        } else {
          // 无法找到可替换位置：提示并不导出
          alert('导出失败：找不到数据区域进行替换。请确保页面包含 CLASSMATES_DATA_START/END 标记。');
          return;
        }
      }

      const blob = new Blob([htmlContent], {type: 'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'classmates_map.html';
      a.click();
      URL.revokeObjectURL(url);
    });

    script.onload = initMap;
  </script>
</body>
</html>
