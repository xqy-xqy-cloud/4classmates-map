<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>班级蹭饭地图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html, #container { width: 100%; height: 100%; }
    #editor-panel {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      z-index: 999;
      width: 320px;
      max-height: 80%;
      overflow-y: auto;
      font-size: 14px;
    }
    #editor-panel.show { display: block; }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px 2px;
    }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-warning { background: #fbbc04; }
    .btn-danger { background: #ea4335; color: white; }
    .btn-success { background: #34a853; color: white; }
    input[type="file"] { display: none; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 4px; text-align: left; }
    th { background: #f2f2f2; }
    .close-btn { float: right; cursor: pointer; font-size: 18px; }
    .hidden-action {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      opacity: 0.3;
      font-size: 12px;
      cursor: default;
      user-select: none;
    }
    .nav-btn {
      display: inline-block;
      padding: 4px 10px;
      margin: 5px 3px 0 0;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
      color: white;
    }
    .nav-amap { background: #0091ff; }
    .nav-baidu { background: #3385ff; }
  </style>
</head>
<body>
  <div id="container"></div>

  <div class="hidden-action" id="editTrigger" title="点击唤起密码框进入编辑">编辑入口</div>

  <div id="editor-panel">
    <span class="close-btn" id="closeEditor">&times;</span>
    <h3>✏️ 编辑同学数据</h3>
    <p class="hint">上传CSV文件批量导入，或手动修改后导出网页</p>
    <input type="file" id="csvFileInput" accept=".csv">
    <button class="btn btn-primary" id="uploadBtn">选择CSV文件</button>
    <button class="btn btn-success" id="applyBtn" style="display:none;">✅ 应用到地图</button>
    <button class="btn btn-warning" id="exportBtn">下载更新后的网页</button>
    <div id="previewTable"></div>
  </div>

  <script>
    // 高德密钥替换区（请自行申请替换下方两个值）
    // NOTE: It's better to avoid committing API keys to a public repo. Replace these values before deployment.
    window._AMapSecurityConfig = {
      securityJsCode: "ed8b9d3491ce1ef0582a9c4ff6afdd01"
    };
    const AMAP_KEY = "b3662a30f3a5bf6baf306aaf79a04b75";
    const EDIT_PASSWORD = "123456"; // 编辑解锁密码 (建议移到安全的后端或在部署前修改)

    const script = document.createElement('script');
    script.src = `https://webapi.amap.com/v2/maps?v=2.0&key=${AMAP_KEY}&plugin=AMap.Geocoder,AMap.Scale,AMap.ToolBar`;
    document.head.appendChild(script);

    // 初始内置数据（可通过CSV导入覆盖）
    let classmatesData = [
      { name: "张三", contact: "13800000001", college: "北京大学", address: "北京市海淀区颐和园路5号" },
      { name: "李四", contact: "13900000002", college: "复旦大学", address: "上海市杨浦区邯郸路220号" },
      { name: "王五", contact: "13600000003", college: "中山大学", address: "广东省广州市海珠区新港西路135号" },
      { name: "赵六", contact: "13700000004", college: "西安交通大学", address: "陕西省西安市碑林区咸宁西路28号" }
    ];

    let map = null, geocoder = null, markers = [];
    let editorPanel = document.getElementById('editor-panel');

    // 简单的 HTML 转义以防 XSS
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 弹窗导航内容 (使用转义后的字段并添加 rel="noopener")
    function generateInfoContent(markerData) {
      const { name, college, contact, address, lng, lat } = markerData;
      const safeName = escapeHTML(name);
      const safeCollege = escapeHTML(college);
      const safeAddress = escapeHTML(address);
      const safeContact = escapeHTML(contact);

      const amapUrl = `https://uri.amap.com/navigation?to=${lng},${lat},${encodeURIComponent(name)}&mode=car&coordinate=gaode`;
      const baiduUrl = `https://api.map.baidu.com/direction?destination=${lat},${lng}&coord_type=gcj02&mode=driving&output=html&src=classmap`;

      return `
        <div style="padding:8px; min-width:160px;">
          <strong>${safeName}</strong><br/>
         ${safeCollege}<br/>
         ${safeAddress}<br/>
         ${safeContact}<br/>
          <div style="margin-top:8px;">
            <a class="nav-btn nav-amap" href="${amapUrl}" target="_blank" rel="noopener">高德导航</a>
            <a class="nav-btn nav-baidu" href="${baiduUrl}" target="_blank" rel="noopener">百度导航</a>
          </div>
        </div>
      `;
    }

    // 初���化地图
    function initMap() {
      map = new AMap.Map('container', {
        zoom: 5,
        center: [104.0, 35.0],
        resizeEnable: true
      });
      map.addControl(new AMap.Scale());
      map.addControl(new AMap.ToolBar());

      AMap.plugin('AMap.Geocoder', () => {
        geocoder = new AMap.Geocoder({});
        addMarkersFromData(classmatesData);
      });
    }

    // 批量生成点位标记
    function addMarkersFromData(dataArray) {
      clearMarkers();
      if (!geocoder) return;
      let loadedCount = 0;
      dataArray.forEach((item) => {
        if (!item.address) {
          loadedCount++;
          return;
        }
        geocoder.getLocation(item.address, (status, result) => {
          loadedCount++;
          if (status === 'complete' && result.geocodes && result.geocodes.length > 0) {
            const lnglat = result.geocodes[0].location;
            const marker = new AMap.Marker({
              position: [lnglat.lng, lnglat.lat],
              title: item.name,
              map: map
            });
            const markerData = {
              name: item.name,
              college: item.college,
              contact: item.contact,
              address: item.address,
              lng: lnglat.lng,
              lat: lnglat.lat
            };
            const infoWindow = new AMap.InfoWindow({
              content: generateInfoContent(markerData),
              offset: new AMap.Pixel(0, -30)
            });
            marker.on('click', () => {
              infoWindow.open(map, marker.getPosition());
            });
            markers.push(marker);
            if (loadedCount === dataArray.length && markers.length > 0) {
              map.setFitView();
            }
          } else {
            console.warn('地址解析失败:', item.address);
          }
        });
      });
    }

    function clearMarkers() {
      markers.forEach(m => m.setMap(null));
      markers = [];
    }

    // 编辑解锁弹窗（修复密码类型BUG）
    let isEditMode = false, pendingData = null;
    document.getElementById('editTrigger').addEventListener('click', () => {
      if (isEditMode) return;
      const pwd = prompt('请输入编辑密码：');
      if (pwd === null) return; // 用户取消
      if (pwd === EDIT_PASSWORD) {
        isEditMode = true;
        editorPanel.classList.add('show');
      } else {
        alert('密码错误！');
      }
    });

    document.getElementById('closeEditor').addEventListener('click', () => {
      editorPanel.classList.remove('show');
      isEditMode = false;
      pendingData = null;
      document.getElementById('applyBtn').style.display = 'none';
      document.getElementById('previewTable').innerHTML = '';
    });

    // CSV文件读取
    document.getElementById('uploadBtn').addEventListener('click', () => {
      document.getElementById('csvFileInput').click();
    });
    document.getElementById('csvFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const csv = ev.target.result;
        const parsed = parseCSV(csv);
        if (parsed.length === 0) {
          alert('CSV解析失败或为空，请检查格式（姓名,联系方式,大学,大学地址）');
          return;
        }
        pendingData = parsed;
        showPreview(parsed);
        document.getElementById('applyBtn').style.display = 'inline-block';
      };
      reader.readAsText(file, 'UTF-8');
    });

    // 改进的 CSV 解析（支持双引号包含、CRLF）
    // 对于更完整的解析，建议使用 PapaParse（https://www.papaparse.com/）
    function parseCSV(str) {
      if (!str) return [];
      // 移除可能的 BOM
      if (str.charCodeAt(0) === 0xFEFF) str = str.slice(1);
      // 规范换行
      const text = str.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      const rows = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"') {
          // 处理转义的双引号
          if (inQuotes && text[i+1] === '"') {
            cur += '"';
            i++; // 跳过转义引号
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }
        if (ch === '\n' && !inQuotes) {
          rows.push(cur);
          cur = '';
          continue;
        }
        cur += ch;
      }
      if (cur !== '') rows.push(cur);
      if (rows.length < 1) return [];

      const headers = rows[0].split(',').map(h => h.trim());
      const nameIdx = headers.findIndex(h => /姓名/.test(h));
      const contactIdx = headers.findIndex(h => /联系方式|电话/.test(h));
      const collegeIdx = headers.findIndex(h => /大学(?!.*地址)/.test(h));
      const addrIdx = headers.findIndex(h => /地址/.test(h));
      if (nameIdx === -1 || addrIdx === -1) {
        alert('CSV表头必须包含“姓名”和“大学地址”列');
        return [];
      }

      const result = [];
      for (let i = 1; i < rows.length; i++) {
        const line = rows[i];
        const row = [];
        let cell = '';
        let q = false;
        for (let k = 0; k < line.length; k++) {
          const c = line[k];
          if (c === '"') { q = !q; continue; }
          if (c === ',' && !q) { row.push(cell.trim()); cell = ''; continue; }
          cell += c;
        }
        row.push(cell.trim());

        result.push({
          name: row[nameIdx] || '',
          contact: contactIdx !== -1 ? (row[contactIdx] || '') : '',
          college: collegeIdx !== -1 ? (row[collegeIdx] || '') : '',
          address: row[addrIdx] || ''
        });
      }
      return result;
    }

    // 表格预览（对内容做转义以防 XSS）
    function showPreview(data) {
      let html = '<table><tr><th>姓名</th><th>大学</th><th>地址</th></tr>';
      data.forEach(item => {
        html += `<tr><td>${escapeHTML(item.name)}</td><td>${escapeHTML(item.college)}</td><td>${escapeHTML(item.address)}</td></tr>`;
      });
      html += '</table>';
      document.getElementById('previewTable').innerHTML = html;
    }

    // 应用CSV数据到地图
    document.getElementById('applyBtn').addEventListener('click', () => {
      if (pendingData) {
        classmatesData = pendingData;
        addMarkersFromData(classmatesData);
        alert('地图已更新！下载新网页文件替换原有文件即可同步给所有人');
      }
    });

    // 导出新版HTML文件（更鲁棒的正则替换）
    document.getElementById('exportBtn').addEventListener('click', () => {
      const newDataStr = JSON.stringify(classmatesData, null, 2);
      let htmlContent = document.documentElement.outerHTML;
      const regex = /let\s+classmatesData\s*=\s*\[[\s\S]*?\]\s*;/;
      const replacement = `let classmatesData = ${newDataStr};`;
      if (regex.test(htmlContent)) {
        htmlContent = htmlContent.replace(regex, replacement);
      }
      const blob = new Blob([htmlContent], {type: 'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'classmates_map.html';
      a.click();
      URL.revokeObjectURL(url);
    });

    script.onload = initMap;
  </script>
</body>
</html>
